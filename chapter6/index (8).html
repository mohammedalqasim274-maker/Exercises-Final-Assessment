<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Petrol Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container -->
    <div class="calculator-box">

        <h1>Petrol Calculator</h1>

        <!-- Cost per liter input -->
        <label for="cost">Cost per liter (£):</label>
        <input type="number" id="cost" value="1.72" step="0.01" class="input-field">

        <!-- Liters purchased input -->
        <label for="liters">Liters purchased:</label>
        <input type="number" id="liters" value="0" step="0.1" class="input-field">

        <!-- Calculate button -->
        <button id="calculateBtn">Calculate Total</button>

        <!-- Result paragraph -->
        <p id="result">Total cost: £0.00</p>

    </div>

    <script src="index.js"></script>
</body>

</html>
